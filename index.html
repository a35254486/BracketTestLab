<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bracket Test Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        :root {
            --NavyBlack: #08262C;
            --Yellow: #E8B00F;
            --White: #FFFFFF;
            --light-gray: #F5F5F5;
            --border: #575757;
            --loser: #bbbbbb;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Roboto Condensed', sans-serif;
            background: var(--light-gray);
            padding: 0.1rem;
            text-align: left;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 100%;
            margin: 0.5;
            background: var(--White);
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 59, 79, 0.15);
            padding: .5rem;
        }
        header {
            text-align: center;
            margin-bottom: 0.1rem;
            background-color: var(--NavyBlack);
            border: 4px solid var(--Yellow);
            padding: 1rem;
            border-radius: 10px;
            position: sticky;
            top: -1px;
            z-index: 10;
        }
        h1 {
            font-family: "Josefin Sans", sans-serif;
            font-size: 4.25rem;
            color: var(--White);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 0.5rem;
            white-space: nowrap;
            overflow: hidden;
        }
        .subtitle {
            font-family: "Josefin Sans", sans-serif;
            font-size: 2.25rem;
            color: var(--White);
            text-transform: uppercase;
            font-weight: 600;
            font-style: italic;
            white-space: nowrap;
            overflow: hidden;
        }
        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
        }
        button {
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-Yellow {
            background: white;
            color: var(--NavyBlack);
            border: 2px solid var(--NavyBlack);
        }
        .btn-Yellow:hover {
            background: var(--NavyBlack);
            color: white;
        }

        /* --- STICKY & SCROLL CONTAINER STYLES --- */
        #round-titles-container {
            position: sticky;
            top: 135px; /* Adjust this to change distance from top */
            z-index: 5;
            background: var(--White);
            padding: 10px 0;
            border-bottom: 2px solid var(--border);
        }
        #matches-scroll-container {
            overflow-x: auto;
            overflow-y: hidden;
        }
        #player {
            display: none;
        }
        
        .bracket-container {
            transform-origin: top left; /* Changed for better zoom */
            display: inline-block;
            min-width: max-content;
        }
        .bracket {
            display: flex;
            justify-content: center;
            align-items: stretch; /* CRITICAL FIX for sticky positioning */
            gap: 60px;
        }
        .bracket-half {
            display: flex;
            gap: 60px;
        }
        .bracket-half.left {
            flex-direction: row;
        }
        .bracket-half.right {
            flex-direction: row-reverse;
        }
        .finals-column {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 5rem;
        }
        .round {
            display: flex;
            flex-direction: column;
        }
        .round-header {
            font-family: "Josefin Sans", sans-serif;
            font-size: 1.4rem;
            color: var(--NavyBlack);
            text-align: center;
            font-weight: 750;
            letter-spacing: 1px;
            font-style: italic;
        }
        #round-titles-container .round {
            padding-bottom: 1.5rem;
        }
        .round-matches {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding-top: 1.5rem;
        }
        .match {
            position: relative;
            margin: 10px 0;
        }
        .team {
            background-color: var(--NavyBlack);
            color: white;
            border: 2px solid var(--NavyBlack);
            padding: 5px 5px;
            min-width: 200px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            font-weight: 500;
            font-size: 1.3rem;
        }
        .team + .team {
             border-top-color: white;
        }
        .team.tbd {
            background-color: #FFFEF5 !important;
            border-color: var(--Yellow) !important;
            color: var(--NavyBlack) !important;
        }
        .team:first-child {
            border-radius: 4px 4px 0 0;
        }
        .team:last-child {
            border-radius: 0 0 4px 4px;
        }
        .team:not(.tbd):hover {
            border-color: var(--Yellow);
            background: #FFFEF5;
            color: var(--NavyBlack);
        }
        .team.winner {
            background: var(--NavyBlack);
            color: white;
            border-color: var(--NavyBlack);
            font-weight: 550;
        }
        .team.loser {
            background: var(--loser);
            color: #5c5c5c;
            opacity: 0.6;
            border: 2px solid var(--border);
        }
        .center-logo {
            display: block;
            max-width: 750px;
            height: auto;
            margin-bottom: 3rem;
        }
        .match::after, .match::before {
            content: '';
            position: absolute;
            background: var(--NavyBlack);
        }
        .match::after {
            left: 100%;
            top: 50%;
            width: 30px;
            height: 2px;
        }
        .match:nth-child(odd)::before {
            left: calc(100% + 30px);
            top: 50%;
            width: 2px;
        }
        .match:nth-child(even)::before {
            left: calc(100% + 30px);
            bottom: 50%;
            width: 2px;
        }
        .round:last-child .match::after, .round:last-child .match::before { display: none; }
        .round1 .match:nth-child(odd)::before { height: 58px; }
        .round1 .match:nth-child(even)::before { height: 58px; }
        .round2 .match:nth-child(odd)::before { height: 146px; }
        .round2 .match:nth-child(even)::before { height: 146px; }
        .round3 .match:nth-child(odd)::before { height: 322px; }
        .round3 .match:nth-child(even)::before { height: 322px; }
        .round4 .match:nth-child(odd)::before { height: 674px; }
        .round4 .match:nth-child(even)::before { height: 674px; }
        .bracket-half.right .match::after { left: auto; right: 100%; }
        .bracket-half.right .match:nth-child(odd)::before,
        .bracket-half.right .match:nth-child(even)::before {
            left: auto;
            right: calc(100% + 30px);
        }
        .champion-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(245, 245, 245, 0.85);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .champion-overlay.show { display: flex; }
        .champion-display { text-align: center; padding: 2rem; background: var(--NavyBlack); border: 4px solid var(--Yellow); border-radius: 8px; }
        .champion-display h2 { font-family: "Josefin Sans", sans-serif; font-size: 4.5rem; color: var(--Yellow); margin-bottom: 1rem; }
        .champion-name { font-size: 4.0rem; font-weight: 700; color: white; text-transform: uppercase; }
    </style>
</head>
<body>
    <div id="player"></div>
    <div class="container">
        <header>
            <h1>Rules of the Road
